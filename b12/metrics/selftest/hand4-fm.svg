<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flowchart diagram">
<title>Flowchart diagram</title>
<rect width="400" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#44507a"/></marker><mask id="m0" maskUnits="userSpaceOnUse" x="0" y="0" width="10" height="10"><rect x="0" y="0" width="10" height="10" fill="#fff"/><circle cx="5" cy="5" r="5.00" fill="#000"/></mask></defs>
<rect x="20.0" y="180.0" width="160.0" height="100.0" rx="8" fill="#f6f7fb" stroke="#858db0" stroke-width="1.4"/>
<rect x="220.0" y="20.0" width="160.0" height="100.0" rx="8" fill="#f6f7fb" stroke="#858db0" stroke-width="1.4"/>
<path d="M 100.0 220.0 L 100.0 150.0 L 350.0 150.0 L 350.0 130.0 L 300.0 130.0 L 300.0 90.0" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>m → n: up</title></path>
<path d="M 70.0 220.0 L 70.0 100.0" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>m → w: side</title></path>
<path d="M 100.0 80.0 L 260.0 80.0" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>w → n: far</title></path>
<g><title>m</title>
<rect x="60.0" y="220.0" width="80.0" height="40.0" rx="5.0" fill="#eef0fb" stroke="#5b66b0" stroke-width="1.8"/>
<text x="100.0" y="240.0" dy="0.33em" text-anchor="middle" fill="#232840">m</text>
</g>
<g><title>n</title>
<rect x="260.0" y="50.0" width="80.0" height="40.0" rx="5.0" fill="#eef0fb" stroke="#5b66b0" stroke-width="1.8"/>
<text x="300.0" y="70.0" dy="0.33em" text-anchor="middle" fill="#232840">n</text>
</g>
<g><title>w</title>
<rect x="40.0" y="60.0" width="60.0" height="40.0" rx="5.0" fill="#eef0fb" stroke="#5b66b0" stroke-width="1.8"/>
<text x="70.0" y="80.0" dy="0.33em" text-anchor="middle" fill="#232840">w</text>
</g>
<rect x="80.0" y="185.0" width="40.0" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
<text x="100.0" y="195.0" dy="0.33em" text-anchor="middle" fill="#232840">up</text>
<rect x="50.0" y="165.0" width="40.0" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
<text x="70.0" y="175.0" dy="0.33em" text-anchor="middle" fill="#232840">side</text>
<rect x="145.0" y="58.0" width="30.0" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
<text x="160.0" y="68.0" dy="0.33em" text-anchor="middle" fill="#232840">far</text>
<rect x="26.0" y="185.0" width="30.0" height="16" rx="4" fill="#f6f7fb" fill-opacity="0.9"/>
<text x="30.0" y="197.0" font-size="11" font-weight="bold" fill="#4a5378">G1</text>
<rect x="226.0" y="25.0" width="30.0" height="16" rx="4" fill="#f6f7fb" fill-opacity="0.9"/>
<text x="230.0" y="37.0" font-size="11" font-weight="bold" fill="#4a5378">G2</text>
</svg>
