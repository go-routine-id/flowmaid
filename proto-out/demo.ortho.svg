<svg xmlns="http://www.w3.org/2000/svg" width="359" height="486" viewBox="0 0 359 486" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flowchart diagram">
<title>Flowchart diagram</title>
<rect width="359" height="486" fill="#ffffff"/>
<defs><filter id="fm-shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#232840" flood-opacity="0.14"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#44507a"/></marker></defs>
<path d="M 151.9 58.0 L 151.9 108.0" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>A → B</title></path>
<path d="M 151.9 150.0 L 151.9 200.0" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>B → C</title></path>
<path d="M 134.5 259.3 L 134.5 284.3 Q 134.5 290.3, 128.5 290.3 L 106.7 290.3 Q 100.7 290.3, 100.7 296.3 L 100.7 321.4" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>C → D: yes</title></path>
<path d="M 169.3 259.3 L 169.3 284.3 Q 169.3 290.3, 175.3 290.3 L 190.1 290.3 Q 196.1 290.3, 196.1 296.3 L 196.1 321.4" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>C → E: no</title></path>
<path d="M 210.1 321.4 L 269.5 321.4 Q 275.5 321.4, 275.5 315.4 L 275.5 287.4 Q 275.5 281.4, 281.5 281.4 L 336.0 281.4 Q 342.0 281.4, 342.0 275.4 L 342.0 196.0 Q 342.0 190.0, 336.0 190.0 L 267.3 190.0 Q 261.3 190.0, 261.3 184.0 L 261.3 156.0 Q 261.3 150.0, 255.3 150.0 L 179.5 150.0" fill="none" stroke="#44507a" stroke-width="2" marker-end="url(#arrow)"><title>E → B</title></path>
<path d="M 73.1 363.4 L 73.1 413.4" fill="none" stroke="#44507a" stroke-width="3.5" marker-end="url(#arrow)"><title>D → F</title></path>
<g><title>Start</title>
<rect x="97.9" y="16.0" width="108.0" height="42.0" rx="21.0" fill="#e5f5ea" stroke="#33a35c" stroke-width="1.8" filter="url(#fm-shadow)"/>
<text x="151.9" y="37.0" dy="0.33em" text-anchor="middle" fill="#232840">Start</text>
</g>
<g><title>Read input</title>
<rect x="102.0" y="108.0" width="99.7" height="42.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.8" filter="url(#fm-shadow)"/>
<text x="151.9" y="129.0" dy="0.33em" text-anchor="middle" fill="#232840">Read input</text>
</g>
<g><title>Valid?</title>
<polygon points="151.9,200.0 203.0,235.7 151.9,271.4 100.8,235.7" fill="#fcf2da" stroke="#d99114" stroke-width="1.8" filter="url(#fm-shadow)"/>
<text x="151.9" y="235.7" dy="0.33em" text-anchor="middle" fill="#232840">Valid?</text>
</g>
<g><title>Process data</title>
<rect x="16.0" y="321.4" width="114.2" height="42.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.8" filter="url(#fm-shadow)"/>
<text x="73.1" y="342.4" dy="0.33em" text-anchor="middle" fill="#232840">Process data</text>
</g>
<g><title>Show error</title>
<rect x="180.2" y="321.4" width="101.0" height="42.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.8" filter="url(#fm-shadow)"/>
<text x="230.7" y="342.4" dy="0.33em" text-anchor="middle" fill="#232840">Show error</text>
</g>
<g><title>Done</title>
<circle cx="73.1" cy="441.9" r="28.6" fill="#f2ecfa" stroke="#8a5cd6" stroke-width="1.8" filter="url(#fm-shadow)"/>
<text x="73.1" y="441.9" dy="0.33em" text-anchor="middle" fill="#232840">Done</text>
</g>
<rect x="110.6" y="280.3" width="35.8" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
<text x="128.5" y="290.3" dy="0.33em" text-anchor="middle" fill="#232840">yes</text>
<rect x="160.5" y="280.3" width="29.6" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
<text x="175.3" y="290.3" dy="0.33em" text-anchor="middle" fill="#232840">no</text>
</svg>
