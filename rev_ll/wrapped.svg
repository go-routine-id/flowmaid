<path d="M 159.0 117.0 C 159.0 147.0, 159.0 147.0, 159.0 177.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>A → B</title></path>
<path d="M 130.1 308.4 C 130.1 348.3, 103.9 348.3, 103.9 388.3" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>B → C: complete</title></path>
<path d="M 187.9 308.4 C 187.9 348.3, 214.1 348.3, 214.1 388.3" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>B → D: incomplete</title></path>
