<svg xmlns="http://www.w3.org/2000/svg" width="345" height="583" viewBox="0 0 345 583" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flowchart diagram">
<title>Flowchart diagram</title>
