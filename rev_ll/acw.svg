<svg xmlns="http://www.w3.org/2000/svg" width="345" height="603" viewBox="0 0 345 603" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flowchart diagram">
<title>Flowchart diagram</title>
<rect width="345" height="603" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#44507a"/></marker></defs>
<path d="M 159.0 117.0 C 159.0 147.0, 159.0 147.0, 159.0 177.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>A → B</title></path>
<path d="M 132.5 310.0 C 132.5 359.2, 74.3 359.2, 74.3 408.3" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>B → C: complete</title></path>
<path d="M 185.5 310.0 C 185.5 359.2, 243.7 359.2, 243.7 408.3" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>B → D: incomplete</title></path>
<path d="M 74.3 463.3 C 74.3 493.3, 74.3 493.3, 74.3 523.3" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>C → E</title></path>
<g><title>ADMINISTRATIVE REQUIREMENTS DOCUMENT VALIDATION</title>
<rect x="82.8" y="28.0" width="152.4" height="89.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.6"/>
<text x="159.0" y="47.0" text-anchor="middle" fill="#232840"><tspan x="159.0" dy="0.33em">ADMINISTRATIVE</tspan><tspan x="159.0" dy="17.0">REQUIREMENTS</tspan><tspan x="159.0" dy="17.0">DOCUMENT</tspan><tspan x="159.0" dy="17.0">VALIDATION</tspan></text>
</g>
<g><title>Are all documents complete and compliant with the rules?</title>
<polygon points="159.0,177.0 268.8,252.6 159.0,328.3 49.2,252.6" fill="#fcf2da" stroke="#d99114" stroke-width="1.6"/>
<text x="159.0" y="227.1" text-anchor="middle" fill="#232840"><tspan x="159.0" dy="0.33em">Are all documents</tspan><tspan x="159.0" dy="17.0">complete and</tspan><tspan x="159.0" dy="17.0">compliant with the</tspan><tspan x="159.0" dy="17.0">rules?</tspan></text>
</g>
<g><title>Issue the certificate</title>
<rect x="28.0" y="408.3" width="92.6" height="55.0" rx="9.0" fill="#e4f5f4" stroke="#199a8e" stroke-width="1.6"/>
