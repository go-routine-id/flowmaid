</g>
<g><title>Return documents to the applicant</title>
<rect x="170.6" y="408.3" width="146.2" height="55.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.6"/>
<text x="243.7" y="427.3" text-anchor="middle" fill="#232840"><tspan x="243.7" dy="0.33em">Return documents</tspan><tspan x="243.7" dy="17.0">to the applicant</tspan></text>
</g>
<g><title>OK</title>
