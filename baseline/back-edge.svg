<svg xmlns="http://www.w3.org/2000/svg" width="351" height="532" viewBox="0 0 351 532" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flowchart diagram">
<title>Flowchart diagram</title>
<rect width="351" height="532" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#44507a"/></marker></defs>
<path d="M 140.5 66.0 C 140.5 96.0, 140.5 96.0, 140.5 126.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>A → B</title></path>
<path d="M 140.5 164.0 C 140.5 194.0, 140.5 194.0, 140.5 224.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>B → C</title></path>
<path d="M 125.8 279.3 C 125.8 314.0, 94.3 314.0, 94.3 348.6" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>C → D: yes</title></path>
<path d="M 155.2 279.3 C 155.2 314.0, 179.7 314.0, 179.7 348.6" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>C → E: no</title></path>
<path d="M 193.7 348.6 C 320.3 308.6, 322.7 204.0, 165.3 164.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>E → B</title></path>
<path d="M 69.5 386.6 C 69.5 416.6, 69.5 416.6, 69.5 446.6" fill="none" stroke="#44507a" stroke-width="3.4" marker-end="url(#arrow)"><title>D → F</title></path>
<g><title>Start</title>
<rect x="103.5" y="28.0" width="74.0" height="38.0" rx="19.0" fill="#e5f5ea" stroke="#33a35c" stroke-width="1.6"/>
<text x="140.5" y="47.0" dy="0.33em" text-anchor="middle" fill="#232840">Start</text>
</g>
<g><title>Read input</title>
<rect x="90.7" y="126.0" width="99.7" height="38.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.6"/>
<text x="140.5" y="145.0" dy="0.33em" text-anchor="middle" fill="#232840">Read input</text>
</g>
<g><title>Valid?</title>
<polygon points="140.5,224.0 191.6,256.3 140.5,288.6 89.4,256.3" fill="#fcf2da" stroke="#d99114" stroke-width="1.6"/>
<text x="140.5" y="256.3" dy="0.33em" text-anchor="middle" fill="#232840">Valid?</text>
</g>
<g><title>Process</title>
<rect x="28.0" y="348.6" width="83.0" height="38.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.6"/>
<text x="69.5" y="367.6" dy="0.33em" text-anchor="middle" fill="#232840">Process</text>
</g>
<g><title>Show error</title>
<rect x="161.0" y="348.6" width="101.0" height="38.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.6"/>
<text x="211.5" y="367.6" dy="0.33em" text-anchor="middle" fill="#232840">Show error</text>
</g>
<g><title>Done</title>
<circle cx="69.5" cy="475.2" r="28.6" fill="#f2ecfa" stroke="#8a5cd6" stroke-width="1.6"/>
<text x="69.5" y="475.2" dy="0.33em" text-anchor="middle" fill="#232840">Done</text>
</g>
<rect x="92.2" y="304.0" width="35.8" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
<text x="110.1" y="314.0" dy="0.33em" text-anchor="middle" fill="#232840">yes</text>
<rect x="152.6" y="304.0" width="29.6" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
<text x="167.4" y="314.0" dy="0.33em" text-anchor="middle" fill="#232840">no</text>
</svg>
