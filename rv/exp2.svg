<svg xmlns="http://www.w3.org/2000/svg" width="321" height="532" viewBox="0 0 321 532" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="Flowchart diagram">
<title>Flowchart diagram</title>
<rect width="321" height="532" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#44507a"/></marker><marker id="arrow-u" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11.9" markerHeight="11.9" orient="auto"><path d="M 0 1 L 9 5 L 0 9 z" fill="#44507a"/></marker></defs>
<path d="M 163.9 66.0 C 163.9 96.0, 163.9 96.0, 163.9 126.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>A → B</title></path>
<path d="M 136.3 164.0 C 136.3 199.0, 100.9 199.0, 100.9 234.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>B → C</title></path>
<path d="M 85.1 288.6 C 85.1 318.6, 85.1 318.6, 85.1 348.6" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>C → D: yes</title></path>
<path d="M 108.1 274.1 C 108.1 311.7, 204.2 311.0, 204.2 348.6" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>C → E: no</title></path>
<path d="M 242.7 348.6 L 242.7 333.2 C 242.7 317.8, 242.7 287.1, 234.2 256.3 C 225.6 225.5, 208.6 194.8, 200.0 179.4 L 191.5 164.0" fill="none" stroke="#44507a" stroke-width="1.7" marker-end="url(#arrow)"><title>E → B</title></path>
<path d="M 85.1 386.6 C 85.1 416.6, 85.1 416.6, 85.1 446.6" fill="none" stroke="#44507a" stroke-width="3.4" marker-end="url(#arrow-u)"><title>D → F</title></path>
<g><title>Start</title>
<rect x="126.9" y="28.0" width="74.0" height="38.0" rx="19.0" fill="#e5f5ea" stroke="#33a35c" stroke-width="1.6"/>
<text x="163.9" y="47.0" dy="0.33em" text-anchor="middle" fill="#232840">Start</text>
</g>
<g><title>Read input</title>
<rect x="114.0" y="126.0" width="99.7" height="38.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.6"/>
<text x="163.9" y="145.0" dy="0.33em" text-anchor="middle" fill="#232840">Read input</text>
</g>
<g><title>Valid?</title>
<polygon points="85.1,224.0 136.2,256.3 85.1,288.6 34.0,256.3" fill="#fcf2da" stroke="#d99114" stroke-width="1.6"/>
<text x="85.1" y="256.3" dy="0.33em" text-anchor="middle" fill="#232840">Valid?</text>
</g>
<g><title>Process data</title>
<rect x="28.0" y="348.6" width="114.2" height="38.0" rx="3.0" fill="#eef1fb" stroke="#5b6dc0" stroke-width="1.6"/>
<text x="85.1" y="367.6" dy="0.33em" text-anchor="middle" fill="#232840">Process data</text>
</g>
<g><title>Show error</title>
