<text x="85.1" y="475.2" dy="0.33em" text-anchor="middle" fill="#232840">Done</text>
</g>
<rect x="67.2" y="308.6" width="35.8" height="20" rx="4" fill="#ffffff" stroke="#d5d9ec"/>
